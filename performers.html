<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stonks - Top Performers</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col">

    <header class="main-sticky-header">
        <div class="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center w-full">
            <div class="flex header-branding items-center gap-6 shrink-0">
                <img src="icon.png" alt="Stonks Logo" class="h-14 w-14 object-contain shrink-0 rounded-2xl">
                <div class="shrink-0">
                    <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-cyan-400 uppercase leading-none">
                        Stonks
                    </h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-indigo-300 mt-2">Top Performers</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 shrink-0">
                <a href="/" class="text-[10px] text-indigo-400/70 uppercase tracking-widest font-bold bg-indigo-950/30 px-4 py-2 rounded-lg border border-indigo-500/20 hover:text-white transition-all">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 md:px-8 py-8">
        <div class="leaderboard-card-container bg-indigo-950/20 border border-indigo-500/20 backdrop-blur-xl rounded-[2.5rem] overflow-visible">
            <table id="performers-table" class="w-full text-left border-separate border-spacing-0 block md:table">
                <thead class="hidden md:table-header-group">
                    <tr class="text-[10px] uppercase tracking-widest text-indigo-300 border-b border-indigo-500/20 bg-indigo-950/40">
                        <th class="px-8 py-6 font-black w-20">Rank</th>
                        <th class="px-8 py-6 font-black">Participant</th>
                        <th class="px-8 py-6 font-black text-center">Seasons</th>
                        <th class="px-8 py-6 font-black text-center">Medals</th>
                        <th class="px-8 py-6 font-black text-right">Avg Return</th>
                    </tr>
                </thead>
                <tbody id="performers-body" class="block md:table-row-group">
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 md:py-6"> 
            <div class="flex justify-start items-center">
                <a href="/winners" class="group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-amber-500/50 hover:bg-amber-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">🏆</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-amber-400">The Archives</p>
                        <p class="text-xs font-bold text-white uppercase">Hall of Fame</p>
                    </div>
                </a>
            </div>
        </div>
    </footer>

    <script src="src/utils/theme.js"></script>
    <script src="src/utils/sanitize.js"></script>
    <script src="src/utils/ticker.js"></script>
    <script src="src/performers.js"></script>
</body>
</html>
