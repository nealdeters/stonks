<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stonks - Contest History</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="bg-[#020617] text-white">

    <header class="main-sticky-header">
        <div class="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center w-full">
            <div class="flex header-branding items-center gap-6 shrink-0">
                <img src="icon.png" alt="Stonks Logo" class="h-14 w-14 object-contain shrink-0">
                <div>
                    <h1 id="year-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-cyan-400 uppercase leading-none">
                        History
                    </h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-indigo-300 mt-2">Contest Archives</p>
                </div>
            </div>
            <a href="/winners.html" class="btn-secondary px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">
                ← Back to Winners
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-12">
        <div class="leaderboard-card-container bg-indigo-950/10 border border-indigo-500/10 shadow-2xl mb-20 overflow-visible">
            <table id="history-table" class="w-full text-left border-separate border-spacing-0 block md:table">
                <thead class="text-slate-300 text-[10px] uppercase font-black tracking-widest hidden md:table-header-group">
                    <tr>
                        <th class="px-8 py-6 hidden md:table-cell">Rank</th>
                        <th class="px-8 py-6">Participant</th>
                        <th class="px-8 py-6 text-center">Stock</th>
                        <th class="px-8 py-6 text-right">% Return</th>
                    </tr>
                </thead>
                <tbody id="history-body" class="block md:table-row-group">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 md:py-6"> 
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <a href="/winners.html" class="w-full md:w-auto group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-amber-500/50 hover:bg-amber-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">🏆</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-amber-400">The Archives</p>
                        <p class="text-xs font-bold text-white uppercase">Hall of Fame</p>
                    </div>
                </a>
                <a href="/performers.html" class="w-full md:w-auto group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">📈</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-cyan-400">Top Performers</p>
                        <p class="text-xs font-bold text-white uppercase">Career Stats</p>
                    </div>
                </a>
                <a href="/news.html" class="w-full md:w-auto group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-emerald-500/50 hover:bg-emerald-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">📰</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-emerald-400">Latest Updates</p>
                        <p class="text-xs font-bold text-white uppercase">Market News</p>
                    </div>
                </a>
            </div>
        </div>
    </footer>

    <script src="src/utils/theme.js"></script>
    <script src="src/utils/sanitize.js"></script>
    <script src="src/utils/ticker.js"></script>
    <script src="src/history.js"></script>
</body>
</html>
