<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stonks - Participant Stats</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="bg-[#020617] text-white">

    <header class="main-sticky-header">
        <div class="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center w-full">
            <div class="flex header-branding items-center gap-6 shrink-0">
                <img src="icon.png" alt="Stonks Logo" class="h-14 w-14 object-contain shrink-0">
                <div>
                    <h1 id="user-name-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-cyan-400 uppercase leading-none">
                        Participant Stats
                    </h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-indigo-300 mt-2">Career Performance</p>
                </div>
            </div>
            <a href="/" class="btn-secondary px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">
                ← Back to Dashboard
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-12">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-12">
            <div class="bg-indigo-950/40 border border-indigo-500/20 p-6 rounded-[2rem] shadow-xl">
                <p class="text-[10px] text-indigo-300/70 uppercase font-black tracking-widest mb-1">Seasons</p>
                <p id="stat-seasons" class="text-2xl font-black text-white">0</p>
            </div>
            <div class="bg-indigo-950/40 border border-indigo-500/20 p-6 rounded-[2rem] shadow-xl">
                <p class="text-[10px] text-indigo-300/70 uppercase font-black tracking-widest mb-1">Avg. Return</p>
                <p id="stat-avg-return" class="text-2xl font-black text-white">0.00%</p>
            </div>

            <div class="bg-indigo-950/40 border border-amber-500/30 p-6 rounded-[2rem] shadow-xl relative overflow-hidden group">
                <div class="absolute -right-2 -top-2 text-4xl opacity-10 group-hover:scale-110 transition-transform">🥇</div>
                <p class="text-[10px] text-amber-500/70 uppercase font-black tracking-widest mb-1">Gold</p>
                <p id="stat-gold" class="text-2xl font-black text-amber-400">0</p>
            </div>
            <div class="bg-indigo-950/40 border border-slate-300/30 p-6 rounded-[2rem] shadow-xl relative overflow-hidden group">
                <div class="absolute -right-2 -top-2 text-4xl opacity-10 group-hover:scale-110 transition-transform">🥈</div>
                <p class="text-[10px] text-slate-300/70 uppercase font-black tracking-widest mb-1">Silver</p>
                <p id="stat-silver" class="text-2xl font-black text-slate-200">0</p>
            </div>
            <div class="bg-indigo-950/40 border border-orange-500/30 p-6 rounded-[2rem] shadow-xl relative overflow-hidden group">
                <div class="absolute -right-2 -top-2 text-4xl opacity-10 group-hover:scale-110 transition-transform">🥉</div>
                <p class="text-[10px] text-orange-400/70 uppercase font-black tracking-widest mb-1">Bronze</p>
                <p id="stat-bronze" class="text-2xl font-black text-orange-400">0</p>
            </div>
        </div>

        <div class="leaderboard-card-container bg-indigo-950/10 border border-indigo-500/10 shadow-2xl mb-20 overflow-visible">
            <table id="stats-table" class="w-full text-left border-separate border-spacing-0 block md:table">
                <thead class="text-slate-300 text-[10px] uppercase font-black tracking-widest bg-indigo-500/5 hidden md:table-header-group">
                    <tr>
                        <th class="px-8 py-6">Year</th>
                        <th class="px-8 py-6">Stock Pick</th>
                        <th class="px-8 py-6 text-center">Place</th>
                        <th class="px-8 py-6 text-right">% Return</th>
                    </tr>
                </thead>
                <tbody id="stats-body" class="block md:table-row-group">
                    </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 md:py-6"> 
            <div class="flex justify-between items-center">
                <a href="/winners" class="group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-amber-500/50 hover:bg-amber-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">🏆</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-amber-400">The Archives</p>
                        <p class="text-xs font-bold text-white uppercase">Hall of Fame</p>
                    </div>
                </a>
                <a href="/performers" class="group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">📈</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-cyan-400">Top Performers</p>
                        <p class="text-xs font-bold text-white uppercase">Career Stats</p>
                    </div>
                </a>
            </div>
        </div>
    </footer>

    <script src="src/utils/theme.js"></script>
    <script src="src/stats.js"></script>
</body>
</html>
