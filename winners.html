<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stonks - Hall of Fame</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="bg-[#020617] text-white min-h-screen">

    <header class="main-sticky-header">
        <div class="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center w-full">
            <div class="flex header-branding items-center gap-6 shrink-0">
                <img src="icon.png" alt="Stonks Logo" class="h-14 w-14 object-contain shrink-0">
                <div class="shrink-0">
                    <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-cyan-400 uppercase leading-none">
                        Stonks
                    </h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-indigo-300 mt-2">Hall of Fame</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 shrink-0">
                <a href="/" class="text-[10px] text-indigo-400/70 uppercase tracking-widest font-bold bg-indigo-950/30 px-4 py-2 rounded-lg border border-indigo-500/20 hover:text-white transition-all">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 pt-12">
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12">
            <div class="bg-indigo-950/40 border border-indigo-500/20 p-6 rounded-[2rem] shadow-xl">
                <p class="text-[10px] text-indigo-300/70 uppercase font-black tracking-widest mb-1">Total Contests</p>
                <p id="stat-seasons" class="text-2xl font-black text-white">0</p>
            </div>
            <div class="bg-indigo-950/40 border border-indigo-500/20 p-6 rounded-[2rem] shadow-xl">
                <p class="text-[10px] text-indigo-300/70 uppercase font-black tracking-widest mb-1">Avg. Contest Return</p>
                <p id="stat-avg-return" class="text-2xl font-black text-white">0.00%</p>
            </div>
            <div class="bg-indigo-950/40 border border-indigo-500/20 p-6 rounded-[2rem] shadow-xl">
                <p class="text-[10px] text-indigo-300/70 uppercase font-black tracking-widest mb-1">Best Year</p>
                <p id="stat-best-year" class="text-2xl font-black text-white">-</p>
            </div>
        </div>

        <div class="leaderboard-card-container bg-indigo-950/10 border border-indigo-500/10 shadow-2xl mb-12 overflow-hidden">
            <div id="winners-body" class="divide-y divide-indigo-500/10">
                <div class="p-20 text-center text-indigo-300/30 font-black uppercase tracking-widest">
                    Loading History...
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 md:py-6"> 
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <a href="/winners" class="w-full md:w-auto group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-amber-500/50 hover:bg-amber-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">🏆</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-amber-400">The Archives</p>
                        <p class="text-xs font-bold text-white uppercase">Hall of Fame</p>
                    </div>
                </a>
                <a href="/performers" class="w-full md:w-auto group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">📈</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-cyan-400">Top Performers</p>
                        <p class="text-xs font-bold text-white uppercase">Career Stats</p>
                    </div>
                </a>
                <a href="/news.html" class="w-full md:w-auto group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-emerald-500/50 hover:bg-emerald-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">📰</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-emerald-400">Latest Updates</p>
                        <p class="text-xs font-bold text-white uppercase">Market News</p>
                    </div>
                </a>
            </div>
        </div>
    </footer>

    <script src="src/utils/theme.js"></script>
    <script src="src/utils/sanitize.js"></script>
    <script src="src/utils/ticker.js"></script>
    <script src="src/winners.js"></script>
</body>
</html>
