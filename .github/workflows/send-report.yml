name: Weekly Report
on:
  schedule:
    - cron: '0 22 * * 5' # Friday at 5:00 PM ET (21:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force send report even if contest is over'
        required: false
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - run: npm install

      - name: Send Report
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            FLAGS="--force"
          fi
          node scripts/send-report.js $FLAGS
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}