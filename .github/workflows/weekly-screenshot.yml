name: Weekly Screenshot
on:
  schedule:
    - cron: '0 21 * * 5' # Every Friday at 4:00 PM ET (21:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force screenshot even if contest is over'
        required: false
        type: boolean
        default: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install puppeteer axios

      - name: Run Capture
        run: |
          # If triggered manually with the 'force' input, append the flag
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            FLAGS="--force"
          fi
          node src/capture.js $FLAGS
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Save Image
        run: |
          git config --global user.name 'Stonks Bot'
          git config --global user.email 'bot@stonks.com'
          git add screenshots/*.png
          git commit -m "📸 Weekly Leaderboard Update [skip ci]" && git push || echo "No changes to commit"