<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schultz Stock Game <span class="current-year"></span></title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 uppercase">
                    Schultz Stock Contest <span class="current-year"></span>
                </h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Market Live (5m Sync)</p>
                </div>
            </div>
            <div id="last-updated" class="text-[10px] text-slate-600 hidden md:block uppercase tracking-widest"></div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-2xl">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Total Capital</p>
                <p id="stat-capital" class="text-xl font-bold">$0</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-2xl">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Market Value</p>
                <p id="stat-value" class="text-xl font-bold">$0</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-2xl text-center">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Overall Gain</p>
                <p id="stat-gain" class="text-xl font-bold">0.00%</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-2xl text-right">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Leader</p>
                <p id="stat-leader" class="text-xl font-bold text-emerald-400">---</p>
            </div>
        </div>

        <div class="bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse block md:table">
                    <thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase font-bold tracking-wider hidden md:table-header-group">
                        <tr>
                            <th class="px-6 py-4">Participant</th>
                            <th class="px-6 py-4 text-center">Stock</th>
                            <th class="px-6 py-4 text-right">Investment</th>
                            <th class="px-6 py-4 text-right">Market</th>
                            <th class="px-6 py-4 text-right">Return</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="block md:table-row-group divide-y divide-slate-700/50"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="src/app.js"></script>
</body>
</html>
