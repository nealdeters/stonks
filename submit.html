<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stonks - Entry Form</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col">

    <header class="main-sticky-header">
        <div class="max-w-7xl mx-auto px-4 md:px-8 flex justify-between items-center w-full">
            <div class="flex header-branding items-center gap-6 shrink-0">
                <img src="icon.png" alt="Stonks Logo" class="h-14 w-14 object-contain shrink-0 rounded-2xl">
                <div class="shrink-0">
                    <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-cyan-400 uppercase leading-none">
                        Stonks
                    </h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-indigo-300 mt-2">Entry Form</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 shrink-0">
                <a href="/" class="text-[10px] text-indigo-400/70 uppercase tracking-widest font-bold bg-indigo-950/30 px-4 py-2 rounded-lg border border-indigo-500/20 hover:text-white transition-all">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-indigo-950/30 border border-indigo-500/30 p-8 rounded-[2.5rem] shadow-2xl backdrop-blur-md">
        
        <form id="entryForm" name="contest-entry" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="space-y-6">
            <input type="hidden" name="form-name" value="contest-entry" />
            
            <p class="hidden">
                <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
            </p>

            <div>
                <label for="name" class="text-[10px] text-slate-300 uppercase font-black tracking-widest mb-2 block ml-1">Name</label>
                <input type="text" id="name" name="name" required 
                       class="w-full bg-[#010409] border border-indigo-500/40 rounded-2xl px-5 py-4 text-sm text-white focus:outline-none focus:border-violet-400 focus:ring-1 focus:ring-violet-400 transition-all placeholder-slate-500"
                       placeholder="e.g. Jane Doe">
            </div>

            <div>
                <label for="email" class="text-[10px] text-slate-300 uppercase font-black tracking-widest mb-2 block ml-1">Email</label>
                <input type="email" id="email" name="email" required 
                       class="w-full bg-[#010409] border border-indigo-500/40 rounded-2xl px-5 py-4 text-sm text-white focus:outline-none focus:border-violet-400 focus:ring-1 focus:ring-violet-400 transition-all placeholder-slate-500"
                       placeholder="your@email.com">
            </div>

            <div>
                <label for="ticker" class="text-[10px] text-slate-300 uppercase font-black tracking-widest mb-2 block ml-1">Ticker</label>
                <input type="text" id="ticker" name="ticker" required 
                       class="w-full bg-[#010409] border border-indigo-500/40 rounded-2xl px-5 py-4 text-sm text-white focus:outline-none focus:border-violet-400 focus:ring-1 focus:ring-violet-400 transition-all placeholder-slate-500 uppercase"
                       placeholder="e.g. NVDA">
            </div>

            <div>
                <label for="secret" class="text-[10px] text-slate-300 uppercase font-black tracking-widest mb-2 block ml-1">Access Secret</label>
                <input type="password" id="secret" name="secret" required 
                    class="w-full bg-[#010409] border border-indigo-500/40 rounded-2xl px-5 py-4 text-sm text-white focus:outline-none focus:border-violet-400 transition-all placeholder-slate-500"
                    placeholder="••••••••">
            </div>

            <div id="error-message" class="hidden text-red-400 text-[10px] font-black uppercase text-center bg-red-500/10 p-4 rounded-xl border border-red-500/30"></div>

            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-violet-500 to-cyan-500 py-5 rounded-2xl font-black uppercase tracking-widest text-sm text-white shadow-lg shadow-indigo-500/30 active:scale-[0.98] transition-all hover:opacity-90">
                Register Entry
            </button>
        </form>
        </div>
    </main>

    <footer>
        <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 md:py-6"> 
            <div class="flex justify-between items-center">
                <a href="/winners" class="group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-amber-500/50 hover:bg-amber-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">🏆</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-amber-400">The Archives</p>
                        <p class="text-xs font-bold text-white uppercase">Hall of Fame</p>
                    </div>
                </a>
                <a href="/performers" class="group flex items-center gap-3 px-5 py-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/10 hover:border-cyan-500/50 hover:bg-cyan-500/5 transition-all">
                    <span class="text-xl group-hover:scale-110 transition-transform">📈</span>
                    <div class="text-left">
                        <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400 group-hover:text-cyan-400">Top Performers</p>
                        <p class="text-xs font-bold text-white uppercase">Career Stats</p>
                    </div>
                </a>
            </div>
        </div>
    </footer>

    <script src="src/utils/theme.js"></script>
    <script src="src/utils/sanitize.js"></script>
    <script src="src/utils/ticker.js"></script>
    <script src="src/submit.js"></script>
</body>
</html>
